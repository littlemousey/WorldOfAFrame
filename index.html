<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8"/>
    <title>World of A-Frame</title>
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="js/portal.js"></script>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
      #hint { position: fixed; left: 16px; bottom: 16px; z-index: 999;
        background: rgba(255,255,255,.78); color: #2c3e34; padding: 10px 14px;
        border-radius: 10px; font-size: 13px; line-height: 1.5; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="hint"><b>Choose a world</b><br>Walk up to a door and click it &middot; WASD to walk &middot; drag to look</div>

    <a-scene fog="type: linear; color: #0d1017; near: 12; far: 34"
             renderer="colorManagement: true; antialias: true">

      <a-assets>
        <img id="floorTexture" src="img/tiles-texture.jpg">
      </a-assets>

      <a-sky color="#0d1017"></a-sky>

      <!-- Room: a dark antechamber so the two lit doorways carry the eye. -->
      <a-plane rotation="-90 0 0" width="18" height="18" position="0 0 -1"
               material="src: #floorTexture; repeat: 6 6; roughness: 0.9"></a-plane>
      <a-box position="0 3.5 -9.9" width="18" height="7" depth="0.4"
             material="color: #1a1f2b; roughness: 1"></a-box>
      <a-box position="-9.1 3.5 -1" width="0.4" height="7" depth="18"
             material="color: #161b25; roughness: 1"></a-box>
      <a-box position="9.1 3.5 -1" width="0.4" height="7" depth="18"
             material="color: #161b25; roughness: 1"></a-box>

      <a-text value="CHOOSE A WORLD" align="center" width="14"
              color="#e8eef7" position="0 5.4 -9.6"></a-text>

      <!-- Left door: the original snowy Christmas scene. -->
      <a-entity position="-3.8 0 -9.5">
        <a-box position="0 2.3 0" width="3.5" height="4.8" depth="0.5"
               material="color: #2b3240; roughness: 0.9"></a-box>
        <a-box class="portal" position="0 2.1 0.32" width="2.7" height="4" depth="0.14"
               material="shader: flat"
               portal="href: christmas.html; color: #7fc4e8; hover: #dff2ff"></a-box>
        <a-text value="Snowy Christmas" align="center" width="6"
                color="#cfe9f7" position="0 4.9 0.4"></a-text>
        <a-entity position="0 2.4 1.6"
                  light="type: point; color: #7fc4e8; intensity: 0.9; distance: 9"></a-entity>
      </a-entity>

      <!-- Right door: the Japanese garden / Ghibli Valley. -->
      <a-entity position="3.8 0 -9.5">
        <a-box position="0 2.3 0" width="3.5" height="4.8" depth="0.5"
               material="color: #2b3240; roughness: 0.9"></a-box>
        <a-box class="portal" position="0 2.1 0.32" width="2.7" height="4" depth="0.14"
               material="shader: flat"
               portal="href: japanese-garden.html; color: #efa8bd; hover: #ffe1ea"></a-box>
        <a-text value="Japanese Garden" align="center" width="6"
                color="#f7d6e0" position="0 4.9 0.4"></a-text>
        <a-entity position="0 2.4 1.6"
                  light="type: point; color: #efa8bd; intensity: 0.9; distance: 9"></a-entity>
      </a-entity>

      <a-entity light="type: ambient; color: #46506b; intensity: 0.7"></a-entity>
      <a-entity position="0 6 2"
                light="type: point; color: #ffffff; intensity: 0.35; distance: 20"></a-entity>

      <a-entity id="rig" position="0 1.6 2" wasd-controls look-controls>
        <a-camera>
          <a-cursor raycaster="objects: .portal" fuse-timeout="1200"
                    color="#ffffff"></a-cursor>
        </a-camera>
      </a-entity>

      <!-- Point-and-click with a headset controller, when one is present. -->
      <a-entity laser-controls="hand: left"  raycaster="objects: .portal"></a-entity>
      <a-entity laser-controls="hand: right" raycaster="objects: .portal"></a-entity>
    </a-scene>
  </body>
</html>
